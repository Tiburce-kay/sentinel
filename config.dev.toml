# Configuration de DÉVELOPPEMENT : stockage dans le dépôt, sans exiger root.
# Usage : SENTINEL_CONFIG=config.dev.toml sentinel doctor
data_dir = "dev-data/store"
models_dir = "models"
strict_permissions = false
socket_path = "dev-data/sentinel.sock"

[auth]
# En développement, pas de mot de passe exigé après le démarrage du service.
require_password_after_boot = false
