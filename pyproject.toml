[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-face"
version = "0.2.0"
description = "Authentification faciale locale pour Linux, résistante à l'usurpation (anti-spoofing) sur webcam ordinaire"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "cryptography>=42",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinel = "sentinel.cli:main"
sentineld = "sentinel.daemon:main"
sentinel-pam = "sentinel.pamconf:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["models.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
